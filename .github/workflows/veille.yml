name: Veille stock MacBook M5 Pro refurb

on:
  schedule:
    - cron: "7-59/10 * * * *"   # toutes les 10 min (à :07, :17...) — heure UTC, décalé pour éviter la cohue de :00
  workflow_dispatch:
    inputs:
      force_test:
        description: "Envoyer un email de test même si indisponible"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: veille
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Vérifier la dispo
        env:
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          MAIL_TO: ${{ secrets.MAIL_TO }}
          FORCE_TEST: ${{ inputs.force_test || 'false' }}
        run: python check.py
      - name: Sauvegarder l'état si changé (évite les emails en double)
        run: |
          git config user.name "veille-bot"
          git config user.email "veille-bot@users.noreply.github.com"
          git add state.json
          git diff --cached --quiet || (git commit -m "état: $(date -u +%FT%TZ)" && git push)
